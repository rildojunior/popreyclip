# Builds and tests PoPreyClip on every push to main, and publishes a release only when asked.
# Changes pile up on main until the owner releases them, so users don't get several small updates a day.
#
# - Push to main: tests and builds the exe, publishes nothing.
# - Release: Actions tab → Release → Run workflow (or `gh workflow run release.yml`). The notes list every
#   commit since the last release. Leave "Publicar" unchecked to only download a test copy.
# - Commits that only touch documentation or logo files skip the build. [skip ci] skips it too and keeps
#   the commit out of the release notes.
# - The version is the last release + 1 on the patch number (1.0.1 -> 1.0.2).
#   To jump to 1.1.0 or 2.0.0, set <Version> in src/PoPreyClip.App/PoPreyClip.App.csproj to that number.

name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/logo/**"
      - "assets/icon.svg"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar a versão para todos (desmarcado: só gera uma cópia de teste)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar o .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Rodar os testes
        run: dotnet test PoPreyClip.slnx -c Release -nologo

      - name: Calcular a versão
        id: version
        shell: pwsh
        run: |
          $project = Get-Content src/PoPreyClip.App/PoPreyClip.App.csproj -Raw
          $base = [Version]([regex]::Match($project, '<Version>([^<]+)</Version>').Groups[1].Value)
          $latestTag = gh release view --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $latestTag) {
            $next = $base
            $latestTag = ""
          } else {
            $latest = [Version]$latestTag.TrimStart('v')
            $next = [Version]::new($latest.Major, $latest.Minor, $latest.Build + 1)
            if ($base -gt $next) { $next = $base }
          }
          $version = "$($next.Major).$($next.Minor).$($next.Build)"
          Write-Host "Última versão: '$latestTag'  ->  nova versão: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "previous=$latestTag" >> $env:GITHUB_OUTPUT

      - name: Gerar o PoPreyClip.exe
        shell: pwsh
        run: |
          dotnet publish src/PoPreyClip.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:Version=${{ steps.version.outputs.version }} -o artifacts/release -nologo
          $hash = (Get-FileHash artifacts/release/PoPreyClip.exe -Algorithm SHA256).Hash
          Set-Content artifacts/release/PoPreyClip.exe.sha256 "$hash  PoPreyClip.exe" -Encoding ascii
          Get-Item artifacts/release/PoPreyClip.exe | Format-List Name, Length

      - name: Guardar a cópia de teste
        if: github.event_name == 'workflow_dispatch' && !inputs.publicar
        uses: actions/upload-artifact@v4
        with:
          name: PoPreyClip-${{ steps.version.outputs.version }}-teste
          path: artifacts/release/

      - name: Publicar a versão
        if: github.event_name == 'workflow_dispatch' && inputs.publicar
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $previous = "${{ steps.version.outputs.previous }}"
          $range = if ($previous) { "$previous..HEAD" } else { "HEAD" }
          # One item per commit: the title in bold, and the "- ..." lines of the commit description as sub-items.
          # Commits marked [skip ci] (internal changes) stay out of the notes friends read.
          $changes = foreach ($hash in (git log $range --no-merges --format=%H)) {
            $subject = git log -1 --format=%s $hash
            if ($subject.Contains('[skip ci]')) { continue }
            $items = [System.Collections.Generic.List[string]]::new()
            foreach ($line in (git log -1 --format=%b $hash)) {
              if ($line -match '^Co-Authored-By:') { continue }
              if ($line -match '^\s*[-*]\s+(.+)$') { $items.Add($Matches[1].Trim()) }
              elseif ($items.Count -gt 0 -and $line -match '^\s+(\S.*)$') { $items[$items.Count - 1] += ' ' + $Matches[1].Trim() }
            }
            if ($items.Count -gt 0) { "- **$subject**"; $items | ForEach-Object { "  - $_" } } else { "- $subject" }
          }
          if (-not $changes) { $changes = "- Melhorias e correções." }
          $notes = @"
          ## PoPreyClip $version

          ### O que mudou

          $($changes -join "`n")

          ### Como atualizar

          Quem já tem o PoPreyClip recebe um aviso dentro do app: é só clicar em **Atualizar agora**.

          Para instalar do zero, baixe o **PoPreyClip.exe** abaixo, em **Assets**, e siga o [README](https://github.com/${{ github.repository }}#-instalação).

          > O arquivo **PoPreyClip.exe.sha256** é usado pela atualização automática para conferir o download. Não precisa baixá-lo.
          "@
          $notes -replace '(?m)^          ', '' | Set-Content artifacts/notes.md -Encoding utf8
          gh release create "v$version" artifacts/release/PoPreyClip.exe artifacts/release/PoPreyClip.exe.sha256 `
            --title "PoPreyClip $version" --notes-file artifacts/notes.md --target ${{ github.sha }}
